# Disparo del correo de recordatorios, cada hora.
#
# Cada persona elige en Ajustes a qué hora quiere su correo. El plan gratuito de
# Vercel solo permite un cron al día, así que este flujo es el que llama a la app
# cada hora; la app decide a quién le toca (solo manda a quien tenga esa hora) y
# la reserva atómica del día evita cualquier duplicado. El cron diario de Vercel
# (vercel.json) queda de respaldo.
#
# GitHub Actions es gratis en repositorios públicos y da 2.000 minutos al mes en
# privados; esta tarea gasta unos segundos por llamada (24 al día ≈ 720 minutos
# al mes contando el redondeo a minuto completo).
#
# Antes de activarlo, crea dos secretos en el repositorio
# (Settings → Secrets and variables → Actions):
#   APP_URL      https://finanza-z42s.vercel.app
#   CRON_SECRET  el mismo valor que pusiste en las variables de la app
name: Recordatorio diario

on:
  schedule:
    # Al minuto 5 de cada hora (en UTC; la app convierte a su zona horaria).
    # GitHub puede demorar unos minutos un disparo programado: por eso la app da
    # unas horas de margen si el correo no salió a la hora exacta.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint del recordatorio
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # Sin secretos, este respaldo del cron no está configurado todavía (por
          # ejemplo, antes de desplegar): se avisa sin marcar el flujo como fallido.
          # Con secretos, cualquier fallo del disparo sí es un error.
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::warning::Sin los secretos APP_URL y CRON_SECRET: este disparo de respaldo no está configurado y se omite."
            exit 0
          fi

          for intento in 1 2 3; do
            codigo=$(curl --silent --show-error --max-time 60 \
              --output respuesta.json --write-out '%{http_code}' \
              --request POST "${APP_URL%/}/api/cron/recordatorios" \
              --header "Authorization: Bearer ${CRON_SECRET}") || codigo="000"

            echo "Intento ${intento}: HTTP ${codigo}"
            cat respuesta.json || true
            echo

            if [ "${codigo}" = "200" ]; then
              exit 0
            fi

            # 401 es configuración incorrecta: reintentar no arregla nada.
            if [ "${codigo}" = "401" ]; then
              echo "El secreto no coincide con el de la app."
              exit 1
            fi

            sleep $((intento * 10))
          done

          echo "El recordatorio no se pudo disparar tras 3 intentos."
          exit 1
